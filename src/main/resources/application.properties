spring.application.name=pie

server.servlet.context-path=/api

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

pie.jwt.secret=${PIE_JWT_SECRET:pie-dev-only-secret-change-me-please-0123456789}
pie.jwt.expiration=PT1H

spring.data.web.pageable.max-page-size=100

spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

supabase.storage.max-file-size-mb=5
supabase.storage.wardrobe-bucket=wardrobe-items
supabase.storage.look-bucket=look-images

spring.config.import=optional:file:.env[.properties]
pie.bedrock.api-key=${AWS_BEARER_TOKEN_BEDROCK:}
pie.bedrock.region=${AWS_REGION:us-east-2}
pie.bedrock.model-id=${BEDROCK_MODEL_ID:google.gemma-3-27b-it}
