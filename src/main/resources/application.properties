spring.application.name=pie

server.servlet.context-path=/api
pie.cors.allowed-origins=${PIE_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://localhost:19006,http://127.0.0.1:8081,http://127.0.0.1:19006}

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

supabase.auth.url=${SUPABASE_URL}
supabase.auth.publishable-key=${SUPABASE_PUBLISHABLE_KEY}

spring.data.web.pageable.max-page-size=100

spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

supabase.storage.url=${SUPABASE_STORAGE_URL:}
supabase.storage.service-role-key=${SUPABASE_STORAGE_SERVICE_ROLE_KEY:}
supabase.storage.max-file-size-mb=5
supabase.storage.wardrobe-bucket=wardrobe-items
supabase.storage.look-bucket=look-images

spring.config.import=optional:file:.env[.properties]
pie.bedrock.api-key=${AWS_BEARER_TOKEN_BEDROCK:}
pie.bedrock.region=${AWS_REGION:us-east-2}
pie.bedrock.model-id=${BEDROCK_MODEL_ID:google.gemma-3-27b-it}
