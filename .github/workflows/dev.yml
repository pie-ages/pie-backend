name: Dev Pipeline

on:
  workflow_dispatch: 
 
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify

